# パックマンが GitHub の草を食べるアニメーション SVG を自動生成します
# 使っている Action: https://github.com/Platane/snk (人気なプロフィールREADMEの定番)
# 生成物は output ブランチに push され、README から参照されます
name: 🟡 Pac-Man が草を食べる

on:
  # 6時間ごとに最新の草を食べてもらう
  schedule:
    - cron: "12 */6 * * *"
  # 手動実行もできる (Actions タブから)
  workflow_dispatch:
  # master に push したときも再生成
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: パックンに草を用意する (generate snake svg)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 食べ終わった草を output ブランチに並べる
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
