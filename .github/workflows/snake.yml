# 🟡 パックマンが GitHub の草(コントリビューショングラフ)を食べるアニメーションSVGを生成します
# 使用している Action: https://github.com/abozanona/pacman-contribution-graph
# 生成物は output ブランチに push され、README から参照されます
name: 🟡 Pac-Man が草を食べる

on:
  schedule:
    # 毎日1回、最新の草でアニメを作り直す(0分は他のワークフローが集中するため12分にずらす)
    - cron: "12 0 * * *"
  # Actions タブから手動実行もできる
  workflow_dispatch:
  # master に push したときも再生成する
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: パックンに最新の草を用意する (generate pacman svg)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # 生成するゲーム(カンマ区切り)。パックンだけでOKなら pacman
          games: 'pacman'

      - name: できあがったSVGを output ブランチに並べる
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
